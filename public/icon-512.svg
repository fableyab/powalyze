<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Swiss Precision Grid (subtle) -->
  
  <g opacity="0.1" stroke="#D4AF37" stroke-width="0.5" fill="none">
    
      <line x1="0" y1="0" x2="0" y2="512"/>
      <line x1="0" y1="0" x2="512" y2="0"/>
    
      <line x1="40" y1="0" x2="40" y2="512"/>
      <line x1="0" y1="40" x2="512" y2="40"/>
    
      <line x1="80" y1="0" x2="80" y2="512"/>
      <line x1="0" y1="80" x2="512" y2="80"/>
    
      <line x1="120" y1="0" x2="120" y2="512"/>
      <line x1="0" y1="120" x2="512" y2="120"/>
    
      <line x1="160" y1="0" x2="160" y2="512"/>
      <line x1="0" y1="160" x2="512" y2="160"/>
    
      <line x1="200" y1="0" x2="200" y2="512"/>
      <line x1="0" y1="200" x2="512" y2="200"/>
    
      <line x1="240" y1="0" x2="240" y2="512"/>
      <line x1="0" y1="240" x2="512" y2="240"/>
    
      <line x1="280" y1="0" x2="280" y2="512"/>
      <line x1="0" y1="280" x2="512" y2="280"/>
    
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
    
      <line x1="360" y1="0" x2="360" y2="512"/>
      <line x1="0" y1="360" x2="512" y2="360"/>
    
      <line x1="400" y1="0" x2="400" y2="512"/>
      <line x1="0" y1="400" x2="512" y2="400"/>
    
      <line x1="440" y1="0" x2="440" y2="512"/>
      <line x1="0" y1="440" x2="512" y2="440"/>
    
  </g>
  
  <!-- Central Logo: P letter with dashboard element -->
  <g transform="translate(256, 256)">
    <!-- P Letter -->
    <path 
      d="M -76.8 -128 
         L -76.8 128 
         M -76.8 -128 
         L 25.6 -128 
         Q 76.8 -128 76.8 -76.8
         Q 76.8 -25.6 25.6 -25.6
         L -76.8 -25.6"
      stroke="url(#goldGrad)" 
      stroke-width="10.24" 
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    
    <!-- Dashboard accent -->
    <circle 
      cx="76.8" 
      cy="51.2" 
      r="20.48" 
      fill="#4A9EFF" 
      opacity="0.8"
    />
    <circle 
      cx="76.8" 
      cy="51.2" 
      r="10.24" 
      fill="#D4AF37"
    />
  </g>
  
  <!-- Corner accent lines -->
  <line x1="20" y1="20" x2="76.8" y2="20" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="76.8" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
  
  <line x1="492" y1="20" x2="435.2" y2="20" stroke="#4A9EFF" stroke-width="2" opacity="0.6"/>
  <line x1="492" y1="20" x2="492" y2="76.8" stroke="#4A9EFF" stroke-width="2" opacity="0.6"/>
</svg>