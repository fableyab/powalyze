<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#4A9EFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.05" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base dark background -->
  <rect width="1920" height="1080" fill="#020713"/>
  
  <!-- Gradient overlay -->
  <rect width="1920" height="1080" fill="url(#goldGradient)" opacity="0.6"/>
  
  <!-- Center radial glow -->
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>
  
  <!-- Swiss Precision Grid - Subtle -->
  <g opacity="0.03">
    <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#smallGrid)" />
    
    <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#D4AF37" stroke-width="1"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)" />
  </g>
  
  <!-- Geometric elements - Executive Dashboard inspired -->
  <g opacity="0.08">
    <!-- Top left corner accent -->
    <line x1="0" y1="120" x2="400" y2="120" stroke="#D4AF37" stroke-width="1" filter="url(#glow)"/>
    <line x1="120" y1="0" x2="120" y2="300" stroke="#D4AF37" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Top right corner accent -->
    <line x1="1520" y1="0" x2="1520" y2="300" stroke="#4A9EFF" stroke-width="1" filter="url(#glow)"/>
    <line x1="1520" y1="120" x2="1920" y2="120" stroke="#4A9EFF" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Bottom left accent -->
    <line x1="0" y1="960" x2="400" y2="960" stroke="#D4AF37" stroke-width="1" filter="url(#glow)"/>
    <line x1="120" y1="780" x2="120" y2="1080" stroke="#D4AF37" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Bottom right accent -->
    <line x1="1520" y1="780" x2="1520" y2="1080" stroke="#4A9EFF" stroke-width="1" filter="url(#glow)"/>
    <line x1="1520" y1="960" x2="1920" y2="960" stroke="#4A9EFF" stroke-width="1" filter="url(#glow)"/>
  </g>
  
  <!-- Dashboard visualization elements (abstract) -->
  <g opacity="0.06">
    <!-- Bar chart abstraction - left -->
    <rect x="200" y="700" width="40" height="150" fill="#D4AF37" filter="url(#glow)"/>
    <rect x="260" y="650" width="40" height="200" fill="#D4AF37" filter="url(#glow)"/>
    <rect x="320" y="720" width="40" height="130" fill="#D4AF37" filter="url(#glow)"/>
    <rect x="380" y="680" width="40" height="170" fill="#D4AF37" filter="url(#glow)"/>
    
    <!-- Circular progress - center right -->
    <circle cx="1600" cy="540" r="80" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="400 100" filter="url(#glow)"/>
    <circle cx="1600" cy="540" r="60" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="300 100" filter="url(#glow)"/>
    
    <!-- Line chart abstraction - bottom -->
    <polyline points="600,850 700,820 800,840 900,800 1000,830 1100,810" fill="none" stroke="#4A9EFF" stroke-width="2" filter="url(#glow)"/>
  </g>
  
  <!-- Data points / metrics indicators -->
  <g opacity="0.1">
    <circle cx="300" cy="300" r="3" fill="#D4AF37" filter="url(#glow)"/>
    <circle cx="960" cy="200" r="3" fill="#D4AF37" filter="url(#glow)"/>
    <circle cx="1620" cy="280" r="3" fill="#4A9EFF" filter="url(#glow)"/>
    <circle cx="500" cy="880" r="3" fill="#D4AF37" filter="url(#glow)"/>
    <circle cx="1420" cy="800" r="3" fill="#4A9EFF" filter="url(#glow)"/>
  </g>
  
  <!-- Swiss cross subtle pattern -->
  <g opacity="0.04">
    <rect x="860" y="480" width="200" height="40" fill="#D4AF37"/>
    <rect x="920" y="420" width="80" height="240" fill="#D4AF37"/>
  </g>
  
  <!-- Connecting lines (network/data flow concept) -->
  <g opacity="0.04" stroke="#D4AF37" stroke-width="1" fill="none">
    <path d="M 300,300 Q 600,250 960,200" filter="url(#glow)"/>
    <path d="M 960,200 Q 1200,220 1620,280" filter="url(#glow)" stroke="#4A9EFF"/>
    <path d="M 500,880 Q 800,850 1420,800" filter="url(#glow)"/>
  </g>
</svg>
